<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>ARIANE — Audit et diagnostic systémique</title>
<style>
:root{--bg:#0f1115;--panel:#161920;--panel2:#1e222b;--border:#2a2f3a;--text:#e6e9ef;--muted:#949aa8;--blue:#3b82f6;--red:#ef4444;--green:#10b981;--yellow:#eab308}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{display:flex;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:5}.sidebar.collapsed{display:none}.side-head{padding:1rem;border-bottom:1px solid var(--border)}.new-chat{width:100%;padding:.75rem;background:var(--blue);color:white;border:0;border-radius:8px;font-weight:600}.history{flex:1;overflow:auto;padding:.5rem}.history-row{display:flex;gap:.3rem;align-items:center;padding:.45rem;border-radius:6px;color:var(--muted)}.history-row.active,.history-row:hover{background:var(--panel2)}.history-row.active{border-left:3px solid var(--blue);color:var(--blue)}.history-name{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:inherit;padding:.3rem}.delete-chat{background:none;border:0;color:var(--red);padding:.3rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--border)}.top-left{display:flex;align-items:center;gap:1rem}.toggle{background:none;border:0;color:var(--muted);font-size:1.5rem}.brand{font-size:1.1rem;margin:0}.tags{font-size:.75rem;color:var(--blue);margin-top:.2rem}.warning{font-size:.75rem;color:var(--yellow);background:#eab30818;padding:.4rem .65rem;border-radius:6px}
.chat{flex:1;min-height:0;overflow:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1.2rem}.welcome{text-align:center;color:var(--muted);margin:auto 0;line-height:1.6;padding:1rem}.logo{font-size:2.5rem;color:var(--blue)}.message{max-width:92%;display:flex;flex-direction:column}.message.user{align-self:flex-end}.message.ai{align-self:flex-start;width:min(100%,1000px)}.msg-head{font-size:.8rem;color:var(--muted);margin-bottom:.4rem}.bubble{padding:1rem;border-radius:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--blue);color:white;border-bottom-right-radius:4px}.ai .bubble{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}.actions{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}.action{border:1px solid var(--border);border-radius:5px;background:none;color:var(--muted);padding:.35rem .55rem;font-size:.78rem}.action:hover{background:var(--panel2);color:var(--text)}.timer{font-size:.7rem;color:var(--muted)}.notice{margin-top:.5rem;padding:.55rem;background:#eab30818;color:var(--yellow);border-radius:6px;font-size:.83rem}.edit{width:100%;min-height:100px;resize:vertical;background:var(--panel2);color:var(--text);border:1px solid var(--blue);border-radius:6px;padding:.6rem}
.input-area{padding:.8rem 1rem;border-top:1px solid var(--border)}.input-box{max-width:1000px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.7rem;display:flex;flex-direction:column;gap:.5rem}.input-box:focus-within{border-color:var(--blue)}.meta{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;color:var(--muted);font-size:.75rem}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:.35rem}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}#userInput{width:100%;min-height:26px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--text);line-height:1.5}.send{align-self:flex-end;background:var(--blue);color:white;border:0;border-radius:6px;padding:.6rem 1rem;font-weight:600}.send:disabled{background:var(--panel2);color:var(--muted);cursor:wait}.typing{display:flex;gap:4px;padding:.5rem 0}.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes bounce{50%{opacity:.25;transform:translateY(-3px)}}
@media(max-width:768px){.sidebar{position:absolute;inset:0 auto 0 0;height:100%;width:min(290px,86vw);transform:translateX(-105%);box-shadow:5px 0 15px #0008}.sidebar.open{transform:translateX(0)}.sidebar.collapsed{display:flex;transform:translateX(-105%)}.warning{display:none}.chat{padding:.8rem}.message{max-width:98%}.top{padding:.7rem}.input-area{padding:.6rem}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar"><div class="side-head"><button class="new-chat" id="newChat">＋ Nouvelle conversation</button></div><div class="history" id="history"></div></aside>
<main class="main"><header class="top"><div class="top-left"><button class="toggle" id="toggle" aria-label="Afficher l'historique">☰</button><div><h1 class="brand">ARIANE</h1><div class="tags">Audit · IOB · IFH-TEC · V(t)</div></div></div><div class="warning">⚠️ Cadre d’analyse conceptuel : vérifier les faits et les conclusions.</div></header>
<section class="chat" id="chat" aria-live="polite"></section>
<form class="input-area" id="form"><div class="input-box"><div class="meta"><span id="status"><i class="dot"></i>Moteur non testé</span><span>Entrée pour envoyer · Maj+Entrée pour un saut de ligne</span></div><textarea id="userInput" rows="1" placeholder="➤ Soumettez votre situation ou votre raisonnement à l'audit d'ARIANE…"></textarea><button class="send" id="send" type="submit">Envoyer ➤</button></div></form></main>
<script>
"use strict";
const API_URL="https://text.pollinations.ai/openai/chat/completions";
const SYSTEM_PROMPT=`Tu es ARIANE, une architecture conceptuelle d'audit et de diagnostic systémique orientée vers le Bien. Tu appliques comme cadre de travail ARI v1.2, IOB v1.0 et IFH-TEC Cycle 2. Ne prétends jamais que ces noms correspondent à des modules logiciels autonomes, à des boucles internes garanties ou à des contrôles techniques qui ne sont pas explicitement disponibles.
PROTOCOLE DE RÉPONSE :
1. Comprendre la demande et préciser les limites pertinentes.
2. Séparer les faits établis, les déclarations attribuées, les hypothèses et les interprétations.
3. Examiner la cohérence et les contre-arguments.
4. Réviser ou nuancer les éléments insuffisamment étayés.
5. Donner une conclusion proportionnée aux preuves disponibles.
IOB v1.0 est une orientation normative : réduire les souffrances évitables et développer les conditions favorables. Ce principe n'est pas une preuve empirique et ne doit pas transformer une valeur en fait.
IFH-TEC Cycle 2 examine, lorsque pertinent, Cosmos/Environnement, Biologie/Vie, Social/Coopération et Conscience/Discernement. Pour V(t), les variables D, E, K et A_eff ne peuvent être utilisées quantitativement que si leurs définitions opérationnelles, données et méthode sont explicites. Ne fabrique aucun score.
ACTUALITÉS ET SOURCES : ne prétends pas avoir effectué une recherche Web sans résultats de recherche effectivement fournis au modèle. N'invente jamais de sources, titres de rapports, citations, dates, chiffres, événements ou URL. Distingue la date d'un événement de celle de sa publication. Si tu ne peux pas vérifier une information, indique clairement « non vérifié » et ne la présente pas comme un fait établi. Le nom d'un organisme seul ne constitue pas une source vérifiable.
TRANSPARENCE TECHNIQUE : ne prétends pas connaître le modèle exact, les limites internes, les boucles de calcul ou les contrôles du logiciel si ces informations ne sont pas disponibles. Distingue le protocole conceptuel demandé des mécanismes réellement exécutés.
RÉPONSE COMPLÈTE EN UN SEUL MESSAGE : réponds de façon autonome, structurée et proportionnée. Pour une demande ordinaire, vise une réponse concise. Pour une analyse complexe, choisis les sections nécessaires et vise environ 900 à 1 400 mots au maximum, sauf demande explicite de détail supérieur. Évite les tableaux volumineux et les répétitions. Termine par une conclusion réelle. Ne demande pas à l'utilisateur de cliquer sur « Continuer », ne propose pas de suite et ne découpe pas volontairement la réponse en plusieurs parties. Si tu ne disposes pas des données nécessaires, dis-le au lieu de remplir l'espace avec des affirmations incertaines.`;
const CHAT_KEY="ariane_chats_v2",CURRENT_KEY="ariane_current_chat_v2",MAX_CONTEXT=20,MAX_CONTINUATION_CALLS=4;
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function newChatObject(){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:"Nouvelle conversation",messages:[]}}
function loadChats(){try{const x=JSON.parse(safeGet(CHAT_KEY)||"[]");return Array.isArray(x)?x.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.messages)).map(c=>({id:c.id,title:String(c.title||"Nouvelle conversation"),messages:c.messages.filter(m=>m&&["user","assistant"].includes(m.role)&&typeof m.content==="string").map(m=>({role:m.role,content:m.content,responseTime:m.responseTime,interrupted:!!m.interrupted}))})):[]}catch(e){return[]}}
let chats=loadChats(),currentId=safeGet(CURRENT_KEY),busy=false,requestId=0;
if(!chats.length){chats=[newChatObject()];currentId=chats[0].id}if(!chats.some(c=>c.id===currentId))currentId=chats[0].id;
function current(){return chats.find(c=>c.id===currentId)||null}
function statusSet(state,text){const s=document.getElementById("status");s.replaceChildren();const d=document.createElement("i");d.className="dot "+(state==="ok"?"ok":state==="bad"?"bad":"");s.append(d,document.createTextNode(text))}
function save(){try{localStorage.setItem(CHAT_KEY,JSON.stringify(chats));localStorage.setItem(CURRENT_KEY,currentId);return true}catch(e){statusSet("bad","Historique non sauvegardé : stockage indisponible");return false}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function format(s){return esc(s).replace(/\*\*(.+?)\*\*/gs,"<strong>$1</strong>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>")}
function action(label,fn){const b=document.createElement("button");b.type="button";b.className="action";b.textContent=label;b.addEventListener("click",fn);return b}
function renderHistory(){const el=document.getElementById("history");el.replaceChildren();chats.forEach(c=>{const row=document.createElement("div");row.className="history-row"+(c.id===currentId?" active":"");const name=document.createElement("button");name.className="history-name";name.textContent=c.title;name.addEventListener("click",()=>switchChat(c.id));const del=document.createElement("button");del.className="delete-chat";del.textContent="🗑️";del.title="Supprimer";del.addEventListener("click",()=>deleteChat(c.id));row.append(name,del);el.append(row)})}
function render(){const el=document.getElementById("chat"),c=current();el.replaceChildren();if(!c)return;if(!c.messages.length){const w=document.createElement("div");w.className="welcome";w.innerHTML='<div class="logo">Λ</div><h2>Intelligence d’audit et de diagnostic systémique</h2><p>ARIANE distingue faits, hypothèses et conclusions.<br>Le moteur sera testé lors de l’envoi.</p>';el.append(w);return}c.messages.forEach((m,i)=>{const a=document.createElement("article");a.className="message "+(m.role==="user"?"user":"ai");const h=document.createElement("div");h.className="msg-head";h.textContent=m.role==="user"?"Vous":"Λ ARIANE";const b=document.createElement("div");b.className="bubble";b.id="bubble-"+i;b.innerHTML=format(m.content);a.append(h,b);if(m.interrupted){const n=document.createElement("div");n.className="notice";n.textContent="Le moteur a signalé une limite de sortie. Cette réponse est incomplète et n'est pas présentée comme une conclusion complète. Reformulez la demande en réduisant son périmètre.";a.append(n)}const acts=document.createElement("div");acts.className="actions";if(m.role==="user")acts.append(action("✏️ Modifier",()=>edit(i)));else{const t=document.createElement("span");t.className="timer";t.textContent=m.responseTime?"⏱ "+m.responseTime+" s":"";acts.append(t,action("📋 Copier",()=>copy(i)),action("🔄 Réessayer",()=>retry(i)))}a.append(acts);el.append(a)});el.scrollTop=el.scrollHeight}
function newChat(){const c=newChatObject();chats.unshift(c);currentId=c.id;save();renderHistory();render();closeSide()}
function switchChat(id){if(!chats.some(c=>c.id===id))return;currentId=id;save();renderHistory();render();closeSide()}
function deleteChat(id){if(!confirm("Supprimer cette conversation de l’historique local ?"))return;chats=chats.filter(c=>c.id!==id);if(currentId===id)currentId=chats[0]?.id||null;if(!currentId){const c=newChatObject();chats=[c];currentId=c.id}save();renderHistory();render()}
function closeSide(){if(innerWidth<=768)document.getElementById("sidebar").classList.remove("open")}
function toggleSide(){const s=document.getElementById("sidebar");if(innerWidth<=768)s.classList.toggle("open");else s.classList.toggle("collapsed")}
function loading(show){document.getElementById("loading")?.remove();if(show){const a=document.createElement("article");a.className="message ai";a.id="loading";a.innerHTML='<div class="msg-head">Λ ARIANE</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';document.getElementById("chat").append(a);a.scrollIntoView({block:"end"})}}
function apiHistory(c,lastIndex){return[{role:"system",content:SYSTEM_PROMPT},...c.messages.slice(0,lastIndex+1).slice(-MAX_CONTEXT).map(m=>({role:m.role,content:m.content}))]}
async function requestCompletion(messages){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);
  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({model:"openai",messages,max_tokens:6000,seed:Math.floor(Math.random()*1e6)}),
      signal:controller.signal
    });
    if(!response.ok){
      const detail=(await response.text().catch(()=>"")).slice(0,240);
      throw Error("HTTP "+response.status+(detail?" — "+detail:""));
    }
    const data=await response.json(),choice=data?.choices?.[0],content=choice?.message?.content;
    if(typeof content!=="string"||!content.trim())throw Error("Réponse vide ou format inattendu du fournisseur");
    return {content:content.trim(),finishReason:choice.finish_reason||null};
  }finally{clearTimeout(timer)}
}
async function generateCompleteAnswer(c,userIndex,onProgress){
  const messages=apiHistory(c,userIndex);
  let fullText="",calls=0;
  while(calls<=MAX_CONTINUATION_CALLS){
    onProgress(calls===0?"Génération de la réponse…":"Finalisation de la réponse en arrière-plan…");
    const next=await requestCompletion(messages);
    calls++;
    fullText+=(fullText?"\n\n":"")+next.content;
    if(next.finishReason!=="length")return {content:fullText.trim(),interrupted:false,calls};
    messages.push({role:"assistant",content:next.content});
    messages.push({role:"user",content:"La réponse précédente a atteint la limite de sortie. Continue exactement à partir de la fin, sans répéter les passages déjà écrits. Termine l'analyse et donne une conclusion finale. N'indique pas à l'utilisateur de cliquer sur Continuer."});
  }
  return {content:fullText.trim(),interrupted:true,calls};
}
async function ask({chatId,userIndex,replaceIndex=null}){
  if(busy)return;
  const c=chats.find(x=>x.id===chatId);if(!c)return;
  busy=true;const id=++requestId,send=document.getElementById("send");
  send.disabled=true;loading(true);statusSet("","Connexion au moteur…");
  const started=Date.now();
  try{
    const result=await generateCompleteAnswer(c,userIndex,text=>statusSet("",text));
    if(id!==requestId)return;
    const secs=((Date.now()-started)/1000).toFixed(1);
    const content=result.content+(result.interrupted?"\n\n[Le fournisseur a atteint sa limite malgré les tentatives de finalisation en arrière-plan. La complétude ne peut pas être garantie.]":"");
    const msg={role:"assistant",content,responseTime:secs,interrupted:result.interrupted};
    if(replaceIndex!==null)c.messages[replaceIndex]=msg;else c.messages.push(msg);
    save();
    statusSet(result.interrupted?"bad":"ok",result.interrupted?"Limite du moteur atteinte":"Réponse finalisée · recherche Web non confirmée");
  }catch(e){
    if(id===requestId){
      const msg=e.name==="AbortError"?"Délai dépassé après 90 secondes.":e.message||"Erreur inconnue";
      c.messages.push({role:"assistant",content:"Impossible d’obtenir une réponse complète du moteur d’IA.\n\nDétail : "+msg+"\n\nAucune conclusion n’a été produite. Vous pouvez réessayer avec une demande plus ciblée.",responseTime:((Date.now()-started)/1000).toFixed(1),interrupted:false});
      save();statusSet("bad","Échec de la requête au moteur");
    }
  }finally{
    if(id===requestId){loading(false);busy=false;send.disabled=false;renderHistory();render()}
  }
}
async function sendMessage(e){e?.preventDefault();if(busy)return;const input=document.getElementById("userInput"),text=input.value.trim(),c=current();if(!text||!c)return;if(!c.messages.length){c.title=text.replace(/\s+/g," ").slice(0,42)+(text.length>42?"…":"");renderHistory()}c.messages.push({role:"user",content:text});save();input.value="";input.style.height="auto";render();await ask({chatId:c.id,userIndex:c.messages.length-1})}
function edit(i){if(busy)return;const c=current(),m=c?.messages[i],b=document.getElementById("bubble-"+i);if(!m||m.role!=="user"||!b)return;b.replaceChildren();const ta=document.createElement("textarea");ta.className="edit";ta.id="edit-"+i;ta.value=m.content;const row=document.createElement("div");row.className="actions";row.append(action("💾 Sauvegarder et régénérer",()=>saveEdit(i)),action("Annuler",render));b.append(ta,row);ta.focus()}
async function saveEdit(i){if(busy)return;const c=current(),text=document.getElementById("edit-"+i)?.value.trim();if(!c||!text||c.messages[i]?.role!=="user")return;c.messages[i].content=text;c.messages=c.messages.slice(0,i+1);save();render();await ask({chatId:c.id,userIndex:i})}
async function retry(i){if(busy)return;const c=current();if(!c||c.messages[i]?.role!=="assistant")return;let u=i-1;while(u>=0&&c.messages[u].role!=="user")u--;if(u<0)return;c.messages=c.messages.slice(0,i);save();render();await ask({chatId:c.id,userIndex:u})}
async function copy(i){const text=current()?.messages[i]?.content;if(typeof text!=="string")return;try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement("textarea");t.value=text;t.style.position="fixed";document.body.append(t);t.select();if(!document.execCommand("copy"))throw Error();t.remove()}statusSet("ok","Texte copié")}catch(e){prompt("Copiez le texte :",text)}}
document.getElementById("newChat").addEventListener("click",newChat);document.getElementById("toggle").addEventListener("click",toggleSide);document.getElementById("form").addEventListener("submit",sendMessage);const input=document.getElementById("userInput");input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage(e)}});
renderHistory();render();statusSet("","Moteur non testé — envoyez un message pour vérifier");
</script>
</body>
</html>
