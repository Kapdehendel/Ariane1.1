<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIANE — Intelligence d'audit</title>
    <style>
        :root { --bg-primary:#0f1115; --bg-secondary:#161920; --bg-tertiary:#1e222b; --border:#2a2f3a; --text:#e6e9ef; --text2:#949aa8; --accent:#3b82f6; --accent2:#2563eb; --danger:#ef4444; --warn-bg:rgba(234,179,8,0.1); --warn:#eab308; }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-primary);color:var(--text);height:100vh;display:flex;overflow:hidden;}
        .sidebar{width:300px;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s;z-index:100;}
        .sidebar.collapsed{transform:translateX(-100%);position:absolute;height:100%;}
        .sidebar-header{padding:1rem;border-bottom:1px solid var(--border);}
        .btn-new{width:100%;padding:.75rem;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;}
        .btn-new:hover{background:var(--accent2);}
        .history{flex:1;overflow-y:auto;padding:.5rem;}
        .hist-item{padding:.75rem;border-radius:6px;color:var(--text2);cursor:pointer;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem;}
        .hist-item:hover{background:var(--bg-tertiary);color:var(--text);}
        .hist-item.active{background:var(--bg-tertiary);color:var(--accent);border-left:3px solid var(--accent);}
        .hist-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .btn-del{background:none;border:none;color:var(--danger);cursor:pointer;opacity:.6;}
        .btn-del:hover{opacity:1;}
        .main{flex:1;display:flex;flex-direction:column;width:100%;}
        .topbar{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-primary);}
        .topbar-left{display:flex;align-items:center;gap:1rem;}
        .btn-menu{background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer;}
        .header h1{font-size:1.1rem;}
        .header .tags{font-size:.75rem;color:var(--accent);margin-top:.25rem;}
        .warn{font-size:.75rem;color:var(--warn);background:var(--warn-bg);padding:.4rem .8rem;border-radius:6px;}
        .chat{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.5rem;}
        .welcome{text-align:center;color:var(--text2);margin-top:15vh;line-height:1.6;}
        .welcome .logo{font-size:2.5rem;margin-bottom:1rem;color:var(--accent);}
        .msg{display:flex;flex-direction:column;max-width:85%;animation:fade .3s;}
        .msg.user{align-self:flex-end;}
        .msg.ai{align-self:flex-start;}
        .msg-head{font-size:.8rem;color:var(--text2);margin-bottom:.4rem;}
        .bubble{padding:1rem;border-radius:12px;line-height:1.6;font-size:.95rem;white-space:pre-wrap;word-wrap:break-word;}
        .msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
        .msg.ai .bubble{background:var(--bg-secondary);border:1px solid var(--border);border-bottom-left-radius:4px;}
        .actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap;}
        .btn-act{background:none;border:1px solid var(--border);color:var(--text2);padding:.3rem .6rem;border-radius:4px;font-size:.75rem;cursor:pointer;}
        .btn-act:hover{background:var(--bg-tertiary);color:var(--text);}
        .edit-area{width:100%;background:var(--bg-tertiary);border:1px solid var(--accent);color:var(--text);padding:.5rem;border-radius:6px;font-family:inherit;resize:vertical;}
        .timer{font-size:.7rem;color:var(--warn);}
        .input-area{padding:1.5rem;border-top:1px solid var(--border);background:var(--bg-primary);}
        .input-box{max-width:800px;margin:0 auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:.75rem;display:flex;flex-direction:column;gap:.5rem;}
        .input-box:focus-within{border-color:var(--accent);}
        .meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);padding:0 .25rem;}
        textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:.95rem;resize:none;outline:none;min-height:24px;max-height:200px;font-family:inherit;}
        .btn-send{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.5rem 1rem;font-weight:600;cursor:pointer;align-self:flex-end;}
        .btn-send:disabled{background:var(--bg-tertiary);color:var(--text2);cursor:not-allowed;}
        .typing{display:flex;gap:4px;padding:.5rem 0;}
        .typing span{width:8px;height:8px;background:var(--text2);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;}
        .typing span:nth-child(1){animation-delay:-.32s;}
        .typing span:nth-child(2){animation-delay:-.16s;}
        @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        @keyframes bounce{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}
        @media(max-width:768px){
            .sidebar{position:absolute;height:100%;transform:translateX(-100%);box-shadow:5px 0 15px rgba(0,0,0,.5);}
            .sidebar.open{transform:translateX(0);}
            .warn{display:none;}
            .chat{padding:1rem;}
            .msg{max-width:95%;}
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><button class="btn-new" onclick="newChat()">＋ Nouvelle conversation</button></div>
        <div class="history" id="historyList"></div>
    </aside>
    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="btn-menu" onclick="toggleSidebar()">☰</button>
                <div class="header"><h1>ARIANE</h1><div class="tags">Audit · IOB · IFH-TEC · V(t)</div></div>
            </div>
            <div class="warn">⚠️ Architecture en cours d'évaluation. Vérifiez les conclusions.</div>
        </header>
        <div class="chat" id="chatArea"></div>
        <div class="input-area">
            <div class="input-box">
                <div class="meta">
                    <span>🌐 Connecté via proxy CORS</span>
                    <span>Entrée = envoyer · Maj+Entrée = saut de ligne</span>
                </div>
                <textarea id="userInput" rows="1" placeholder="➤ Soumettez votre raisonnement à l'audit d'ARIANE..."></textarea>
                <button class="btn-send" id="sendBtn" onclick="handleSend()">Envoyer ➤</button>
            </div>
        </div>
    </main>

    <script>
        const SYSTEM = `Tu es ARIANE, intelligence d'audit systémique orientée vers le bien. Applique strictement :
1. ARI : distingue FAITS / HYPOTHÈSES / INTERPRÉTATIONS / CONCLUSIONS.
2. IOB : réduire la souffrance évitable, développer les conditions favorables.
3. IFH-TEC : Cosmos, Biologie, Social, Conscience.
4. V(t) : dépendance D, exposition E, concentration K, adaptation A_eff.
Format : 📌 FAITS · 🔍 HYPOTHÈSES · ⚙️ ANALYSE SYSTÉMIQUE · 🎯 IOB · ⚖️ CONCLUSION & RÉVISION.`;

        // Proxy CORS pour contourner les blocages navigateur + Neocities
        const PROXY = "https://corsproxy.io/?";
        const API = "https://text.pollinations.ai/v1/chat/completions";

        let chats = JSON.parse(localStorage.getItem('ariane_chats')) || [];
        let curId = localStorage.getItem('ariane_cur') || null;
        if(!chats.length) newChat(false);
        else if(!curId || !chats.find(c=>c.id===curId)) curId = chats[0].id;

        const save = () => {
            localStorage.setItem('ariane_chats', JSON.stringify(chats));
            localStorage.setItem('ariane_cur', curId);
        };
        const cur = () => chats.find(c=>c.id===curId);

        function renderSide(){
            const l = document.getElementById('historyList');
            l.innerHTML = '';
            chats.forEach(c => {
                const d = document.createElement('div');
                d.className = `hist-item ${c.id===curId?'active':''}`;
                d.innerHTML = `<span class="hist-title" onclick="switchChat('${c.id}')">${c.title||'Nouvelle'}</span>
                    <button class="btn-del" onclick="delChat('${c.id}',event)">🗑️</button>`;
                l.appendChild(d);
            });
        }

        function renderChat(){
            const c = cur();
            const a = document.getElementById('chatArea');
            a.innerHTML = '';
            if(!c.messages.length){
                a.innerHTML = `<div class="welcome"><div class="logo">Λ</div><h2>Intelligence d'audit systémique</h2><p style="margin-top:1rem;">Connectée à Internet. Prête à auditer.</p></div>`;
                return;
            }
            c.messages.forEach((m,i)=>{
                const d = document.createElement('div');
                d.className = `msg ${m.role==='assistant'?'ai':m.role}`;
                let acts = '';
                if(m.role==='user'){
                    acts = `<button class="btn-act" onclick="editMsg(${i})">✏️ Modifier</button>`;
                } else {
                    const t = m.responseTime ? `⏱ ${m.responseTime}s` : '';
                    acts = `<span class="timer">${t}</span>
                        <button class="btn-act" onclick="copyMsg(${i})">📋 Copier</button>
                        <button class="btn-act" onclick="retryMsg(${i})">🔄 Réessayer</button>`;
                }
                d.innerHTML = `<div class="msg-head"><strong>${m.role==='user'?'Vous':'Λ ARIANE'}</strong></div>
                    <div class="bubble" id="mc-${i}">${fmt(m.content)}</div>
                    <div class="actions">${acts}</div>`;
                a.appendChild(d);
            });
            a.scrollTop = a.scrollHeight;
        }

        const fmt = t => t.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');

        function newChat(render=true){
            const n = {id:Date.now().toString(), title:'Nouvelle', messages:[]};
            chats.unshift(n); curId = n.id; save();
            if(render){renderSide();renderChat();if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open');}
        }
        function switchChat(id){curId=id;save();renderSide();renderChat();if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open');}
        function delChat(id,e){
            e.stopPropagation();
            if(!confirm("Supprimer ?"))return;
            chats = chats.filter(c=>c.id!==id);
            if(curId===id){curId=chats.length?chats[0].id:null;if(!curId)newChat(false);}
            save();renderSide();renderChat();
        }

        async function handleSend(){
            const inp = document.getElementById('userInput');
            const t = inp.value.trim();
            if(!t) return;
            const c = cur();
            if(!c.messages.length){c.title=t.substring(0,30);save();renderSide();}
            c.messages.push({role:'user',content:t});
            save();renderChat();
            inp.value='';inp.style.height='auto';
            await callAI();
        }

        async function callAI(retryIdx=null){
            const c = cur();
            const a = document.getElementById('chatArea');
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;

            const ld = document.createElement('div');
            ld.className='msg ai';ld.id='ld';
            ld.innerHTML=`<div class="msg-head"><strong>Λ ARIANE</strong></div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
            a.appendChild(ld);a.scrollTop=a.scrollHeight;

            const start = Date.now();
            const msgs = [{role:'system',content:SYSTEM}];
            const lim = retryIdx!==null ? retryIdx : c.messages.length;
            for(let i=0;i<lim;i++) msgs.push({role:c.messages[i].role,content:c.messages[i].content});

            try {
                // Requête POST via proxy CORS
                const res = await fetch(PROXY + encodeURIComponent(API), {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({model:'openai', messages:msgs, seed:Math.floor(Math.random()*10000)})
                });
                if(!res.ok) throw new Error('HTTP '+res.status);
                const data = await res.json();
                const txt = data.choices[0].message.content;
                const time = ((Date.now()-start)/1000).toFixed(1);
                document.getElementById('ld').remove();

                if(retryIdx!==null) c.messages[retryIdx]={role:'assistant',content:txt,responseTime:time};
                else c.messages.push({role:'assistant',content:txt,responseTime:time});
                save();renderChat();
            } catch(err){
                document.getElementById('ld').remove();
                const ed = document.createElement('div');
                ed.className='msg ai';
                ed.innerHTML=`<div class="msg-head"><strong>⚠️ Erreur</strong></div>
                    <div class="bubble" style="border-color:var(--danger);color:var(--danger);">
                        Impossible de contacter le moteur.<br><small>${err.message}</small>
                    </div>
                    <div class="actions"><button class="btn-act" onclick="retryMsg(${c.messages.length})">🔄 Réessayer</button></div>`;
                a.appendChild(ed);
            } finally { btn.disabled=false; }
        }

        function editMsg(i){
            const c=cur(),m=c.messages[i],b=document.getElementById('mc-'+i);
            b.innerHTML=`<textarea class="edit-area" id="ea-${i}" rows="3">${m.content}</textarea>
                <div style="margin-top:.5rem;display:flex;gap:.5rem;">
                    <button class="btn-act" style="background:var(--accent);color:#fff;border:none;" onclick="saveEdit(${i})">💾 Sauvegarder & Régénérer</button>
                    <button class="btn-act" onclick="renderChat()">Annuler</button>
                </div>`;
            document.getElementById('ea-'+i).focus();
        }
        function saveEdit(i){
            const c=cur(),t=document.getElementById('ea-'+i).value.trim();
            if(!t)return;
            c.messages[i].content=t;
            c.messages=c.messages.slice(0,i+1);
            save();renderChat();callAI(i);
        }
        function retryMsg(i){
            const c=cur();
            c.messages.splice(i,1);
            save();renderChat();
            callAI(i-1);
        }
        function copyMsg(i){
            const txt = cur().messages[i].content;
            navigator.clipboard.writeText(txt).then(()=>{
                const b = event.target.closest('.btn-act');
                const o = b.innerHTML;
                b.innerHTML='✅ Copié !';
                setTimeout(()=>b.innerHTML=o,2000);
            });
        }
        function toggleSidebar(){
            const s=document.getElementById('sidebar');
            if(window.innerWidth<=768)s.classList.toggle('open');
            else s.classList.toggle('collapsed');
        }

        const ta=document.getElementById('userInput');
        ta.addEventListener('input',function(){this.style.height='auto';this.style.height=this.scrollHeight+'px';});
        ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}});

        renderSide();renderChat();
    </script>
</body>
</html>
