<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIANE — Intelligence d'audit et de diagnostic systémique</title>
    <style>
        :root {
            --bg-primary: #0f1115; --bg-secondary: #161920; --bg-tertiary: #1e222b;
            --border-color: #2a2f3a; --text-primary: #e6e9ef; --text-secondary: #949aa8;
            --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --success: #10b981;
            --warning-bg: rgba(234, 179, 8, 0.1); --warning-text: #eab308;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 300px; background-color: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border-color); }
        .btn-new-chat { width: 100%; padding: 0.75rem; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-new-chat:hover { background-color: var(--accent-hover); }
        .history-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .history-item { padding: 0.75rem; border-radius: 6px; color: var(--text-secondary); cursor: pointer; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; transition: background 0.2s; }
        .history-item:hover { background-color: var(--bg-tertiary); color: var(--text-primary); }
        .history-item.active { background-color: var(--bg-tertiary); color: var(--accent); border-left: 3px solid var(--accent); }
        .history-item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-delete-chat { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px; opacity: 0.6; }
        .btn-delete-chat:hover { opacity: 1; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        .top-bar { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background-color: var(--bg-primary); }
        .top-bar-left { display: flex; align-items: center; gap: 1rem; }
        .btn-toggle-sidebar { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
        .header-info h1 { font-size: 1.1rem; font-weight: 600; }
        .header-info .tags { font-size: 0.75rem; color: var(--accent); margin-top: 0.25rem; letter-spacing: 0.5px; }
        .warning-banner { font-size: 0.75rem; color: var(--warning-text); background: var(--warning-bg); padding: 0.4rem 0.8rem; border-radius: 6px; }

        /* Chat Area */
        .chat-area { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; scroll-behavior: smooth; }
        .welcome-message { text-align: center; color: var(--text-secondary); margin-top: 15vh; line-height: 1.6; }
        .welcome-message .logo { font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent); }

        /* Messages */
        .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease; }
        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; }
        .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; font-size: 0.8rem; color: var(--text-secondary); }
        .message-bubble { padding: 1rem; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word; }
        .message.user .message-bubble { background-color: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .message.ai .message-bubble { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
        .message-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .btn-action { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s; }
        .btn-action:hover { background-color: var(--bg-tertiary); color: var(--text-primary); border-color: var(--text-secondary); }
        .edit-textarea { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--accent); color: var(--text-primary); padding: 0.5rem; border-radius: 6px; font-family: inherit; font-size: 0.95rem; resize: vertical; }
        .timer-badge { font-size: 0.7rem; color: var(--warning-text); display: flex; align-items: center; gap: 0.3rem; }

        /* Input Area */
        .input-area { padding: 1.5rem; border-top: 1px solid var(--border-color); background-color: var(--bg-primary); }
        .input-container { max-width: 800px; margin: 0 auto; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .input-container:focus-within { border-color: var(--accent); }
        .input-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-secondary); padding: 0 0.25rem; }
        textarea { width: 100%; background: transparent; border: none; color: var(--text-primary); font-size: 0.95rem; resize: none; outline: none; min-height: 24px; max-height: 200px; font-family: inherit; }
        .btn-send { background-color: var(--accent); color: white; border: none; border-radius: 6px; padding: 0.5rem 1rem; font-weight: 600; cursor: pointer; align-self: flex-end; }
        .btn-send:disabled { background-color: var(--bg-tertiary); color: var(--text-secondary); cursor: not-allowed; }

        /* Loading */
        .typing-indicator { display: flex; gap: 4px; padding: 0.5rem 0; }
        .typing-indicator span { width: 8px; height: 8px; background-color: var(--text-secondary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(0); }
            .warning-banner { display: none; }
            .chat-area { padding: 1rem; }
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" onclick="createNewConversation()">＋ Nouvelle conversation</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()">☰</button>
                <div class="header-info">
                    <h1>ARIANE</h1>
                    <div class="tags">Audit · IOB · IFH-TEC · V(t)</div>
                </div>
            </div>
            <div class="warning-banner">⚠️ Architecture de raisonnement en cours d'évaluation. Vérifiez les conclusions.</div>
        </header>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <div class="input-container">
                <div class="input-meta">
                    <span id="connectionStatus">🌐 Connecté à Internet</span>
                    <span>Entrée pour envoyer, Maj+Entrée pour sauter une ligne</span>
                </div>
                <textarea id="userInput" rows="1" placeholder="➤ Soumettez votre situation ou votre raisonnement à l'audit d'ARIANE..."></textarea>
                <button class="btn-send" id="sendBtn" onclick="handleSend()">Envoyer ➤</button>
            </div>
        </div>
    </main>

    <script>
        // --- 1. CONFIGURATION & SYSTÈME ARIANE ---
        const SYSTEM_PROMPT = `Tu es ARIANE, une intelligence d'audit et de diagnostic systémique orientée vers le bien.
        Tu dois STRICTEMENT appliquer les 4 fondements suivants dans tes réponses :
        1. ARI (Audit et Révision) : Distingue clairement les FAITS établis, les HYPOTHÈSES, les INTERPRÉTATIONS et les CONCLUSIONS. Vérifie si les preuves soutiennent les conclusions. Proportionne ton degré de certitude à la qualité des preuves.
        2. IOB (Intelligence Orientée vers le Bien) : Ton principe directeur est d'améliorer les moyens pour réduire la souffrance évitable et développer les conditions favorables. Ne confonds pas "bénéfique" et "vrai", mais utilise cela comme boussole normative.
        3. IFH-TEC : Analyse les systèmes complexes selon 4 dimensions : Cosmos/Environnement, Biologie/Vie, Social/Coopération, Conscience/Discernement. Identifie les dépendances et vulnérabilités.
        4. V(t) (Vulnérabilité Systémique) : Évalue la dépendance (D), l'exposition (E), la concentration des risques (K) et l'adaptation effective (A_eff).
        
        Format de réponse attendu :
        - 📌 FAITS ÉTABLIS
        - 🔍 HYPOTHÈSES & INTERPRÉTATIONS
        - ⚙️ ANALYSE SYSTÉMIQUE (IFH-TEC & V(t))
        - 🎯 ORIENTATION IOB (Réduction de la souffrance évitable)
        - ⚖️ CONCLUSION & CONDITIONS DE RÉVISION
        
        Reste rigoureux, factuel, et n'hésite pas à souligner les limites de l'analyse.`;

        const API_URL = "https://text.pollinations.ai/openai/chat/completions";
        
        // --- 2. GESTION DES DONNÉES (LocalStorage) ---
        let conversations = JSON.parse(localStorage.getItem('ariane_chats')) || [];
        let currentChatId = localStorage.getItem('ariane_current_chat') || null;

        if (conversations.length === 0) {
            createNewConversation(false);
        } else if (!currentChatId || !conversations.find(c => c.id === currentChatId)) {
            currentChatId = conversations[0].id;
        }

        function saveData() {
            localStorage.setItem('ariane_chats', JSON.stringify(conversations));
            localStorage.setItem('ariane_current_chat', currentChatId);
        }

        function getCurrentChat() {
            return conversations.find(c => c.id === currentChatId);
        }

        // --- 3. GESTION DE L'INTERFACE ---
        function renderSidebar() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            conversations.forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.innerHTML = `
                    <span class="history-item-title" onclick="switchChat('${chat.id}')">${chat.title || 'Nouvelle conversation'}</span>
                    <button class="btn-delete-chat" onclick="deleteChat('${chat.id}', event)" title="Supprimer">🗑️</button>
                `;
                list.appendChild(div);
            });
        }

        function renderChat() {
            const chat = getCurrentChat();
            const area = document.getElementById('chatArea');
            area.innerHTML = '';

            if (chat.messages.length === 0) {
                area.innerHTML = `
                    <div class="welcome-message">
                        <div class="logo">Λ</div>
                        <h2>Intelligence d'audit et de diagnostic systémique</h2>
                        <p style="margin-top: 1rem; max-width: 500px; margin-left: auto; margin-right: auto;">
                            ARIANE distingue faits, hypothèses et conclusions.<br>
                            Connectée à Internet. Prête à auditer vos raisonnements.
                        </p>
                    </div>`;
                return;
            }

            chat.messages.forEach((msg, index) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.role === 'assistant' ? 'ai' : msg.role}`;
                
                let actionsHtml = '';
                if (msg.role === 'user') {
                    actionsHtml = `<button class="btn-action" onclick="editMessage(${index})">✏️ Modifier</button>`;
                } else {
                    const timerText = msg.responseTime ? `⏱ ${msg.responseTime}s` : '';
                    // Utilisation d'un attribut data pour stocker l'index, plus sûr que de passer le texte en argument
                    actionsHtml = `
                        <span class="timer-badge">${timerText}</span>
                        <button class="btn-action" onclick="copyMessage(${index})">📋 Copier</button>
                        <button class="btn-action" onclick="retryMessage(${index})">🔄 Réessayer</button>
                    `;
                }

                msgDiv.innerHTML = `
                    <div class="message-header">
                        <strong>${msg.role === 'user' ? 'Vous' : 'Λ ARIANE'}</strong>
                    </div>
                    <div class="message-bubble" id="msg-content-${index}">${formatText(msg.content)}</div>
                    <div class="message-actions">${actionsHtml}</div>
                `;
                area.appendChild(msgDiv);
            });
            area.scrollTop = area.scrollHeight;
        }

        function formatText(text) {
            return text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        // --- 4. LOGIQUE DE CONVERSATION ---
        function createNewConversation(render = true) {
            const newChat = {
                id: Date.now().toString(),
                title: 'Nouvelle conversation',
                messages: []
            };
            conversations.unshift(newChat);
            currentChatId = newChat.id;
            saveData();
            if (render) {
                renderSidebar();
                renderChat();
                if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
            }
        }

        function switchChat(id) {
            currentChatId = id;
            saveData();
            renderSidebar();
            renderChat();
            if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if (!confirm("Supprimer cette conversation de l'historique ?")) return;
            conversations = conversations.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = conversations.length > 0 ? conversations[0].id : null;
                if (!currentChatId) createNewConversation(false);
            }
            saveData();
            renderSidebar();
            renderChat();
        }

        // --- 5. ENVOI ET API INTERNET ---
        async function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const chat = getCurrentChat();
            if (chat.messages.length === 0) {
                chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
                saveData();
                renderSidebar();
            }

            chat.messages.push({ role: 'user', content: text });
            saveData();
            renderChat();
            
            input.value = '';
            input.style.height = 'auto';
            
            await generateAIResponse();
        }

        async function generateAIResponse(retryIndex = null) {
            const chat = getCurrentChat();
            const area = document.getElementById('chatArea');
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.id = 'loading-msg';
            loadingDiv.innerHTML = `
                <div class="message-header"><strong>Λ ARIANE</strong></div>
                <div class="message-bubble">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            `;
            area.appendChild(loadingDiv);
            area.scrollTop = area.scrollHeight;

            const startTime = Date.now();
            
            const apiMessages = [{ role: 'system', content: SYSTEM_PROMPT }];
            const limit = retryIndex !== null ? retryIndex : chat.messages.length;
            for (let i = 0; i < limit; i++) {
                apiMessages.push({ role: chat.messages[i].role, content: chat.messages[i].content });
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai",
                        messages: apiMessages,
                        seed: Math.floor(Math.random() * 10000)
                    })
                });

                if (!response.ok) throw new Error("Erreur de connexion à l'API");
                
                const data = await response.json();
                const aiText = data.choices[0].message.content;
                const responseTime = ((Date.now() - startTime) / 1000).toFixed(1);

                document.getElementById('loading-msg').remove();

                if (retryIndex !== null) {
                    chat.messages[retryIndex] = { role: 'assistant', content: aiText, responseTime: responseTime };
                } else {
                    chat.messages.push({ role: 'assistant', content: aiText, responseTime: responseTime });
                }
                
                saveData();
                renderChat();

            } catch (error) {
                document.getElementById('loading-msg').remove();
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai';
                errorDiv.innerHTML = `
                    <div class="message-header"><strong>⚠️ Erreur</strong></div>
                    <div class="message-bubble" style="border-color: var(--danger); color: var(--danger);">
                        Impossible de contacter le moteur d'IA. Vérifiez votre connexion Internet.<br>
                        <small>${error.message}</small>
                    </div>
                    <div class="message-actions">
                        <button class="btn-action" onclick="retryMessage(${chat.messages.length})">🔄 Réessayer</button>
                    </div>
                `;
                area.appendChild(errorDiv);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // --- 6. ACTIONS SUR LES MESSAGES ---
        function editMessage(index) {
            const chat = getCurrentChat();
            const msg = chat.messages[index];
            const bubble = document.getElementById(`msg-content-${index}`);
            
            bubble.innerHTML = `
                <textarea class="edit-textarea" id="edit-area-${index}" rows="3">${msg.content}</textarea>
                <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
                    <button class="btn-action" style="background:var(--accent); color:white; border:none;" onclick="saveEdit(${index})">💾 Sauvegarder & Régénérer</button>
                    <button class="btn-action" onclick="renderChat()">Annuler</button>
                </div>
            `;
            document.getElementById(`edit-area-${index}`).focus();
        }

        function saveEdit(index) {
            const chat = getCurrentChat();
            const newText = document.getElementById(`edit-area-${index}`).value.trim();
            if (!newText) return;

            chat.messages[index].content = newText;
            chat.messages = chat.messages.slice(0, index + 1);
            saveData();
            renderChat();
            generateAIResponse(index);
        }

        function retryMessage(index) {
            const chat = getCurrentChat();
            const userMsgIndex = index - 1;
            chat.messages.splice(index, 1);
            saveData();
            renderChat();
            generateAIResponse(userMsgIndex);
        }

        // --- CORRECTION DU BOUTON COPIER ---
        function copyMessage(index) {
            const chat = getCurrentChat();
            const textToCopy = chat.messages[index].content;
            
            // Méthode moderne avec fallback pour les anciens navigateurs
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showCopyFeedback(index);
                }).catch(err => {
                    console.error('Erreur clipboard moderne:', err);
                    fallbackCopyText(textToCopy, index);
                });
            } else {
                fallbackCopyText(textToCopy, index);
            }
        }

        function fallbackCopyText(text, index) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  // Avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCopyFeedback(index);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                alert("Impossible de copier automatiquement. Veuillez sélectionner le texte manuellement.");
            }
            document.body.removeChild(textArea);
        }

        function showCopyFeedback(index) {
            // Trouver le bouton spécifique dans le DOM pour changer son texte temporairement
            const msgActions = document.querySelectorAll('.message-actions')[index];
            if (msgActions) {
                const btn = msgActions.querySelector('button[onclick^="copyMessage"]');
                if (btn) {
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '✅ Copié !';
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                    }, 2000);
                }
            }
        }

        // --- 7. UTILITAIRES ---
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            if (window.innerWidth <= 768) { sb.classList.toggle('open'); } 
            else { sb.classList.toggle('collapsed'); }
        }

        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // Initialisation
        renderSidebar();
        renderChat();
    </script>
</body>
</html>
